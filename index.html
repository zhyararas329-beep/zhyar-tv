<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHYAR TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f0f1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .header { color: #00d2ff; font-size: 26px; font-weight: bold; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        .video-container { width: 100%; max-width: 700px; margin: 0 auto 15px; border: 2px solid #6f42c1; border-radius: 12px; overflow: hidden; background: black; box-shadow: 0 0 15px rgba(111, 66, 193, 0.4); }
        video { width: 100%; aspect-ratio: 16/9; display: block; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        .channel-btn { background: #1a1a2e; border: 1px solid #333; padding: 12px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .channel-btn:active { transform: scale(0.95); background: #252545; }
        .channel-btn img { width: 55px; height: 55px; margin-bottom: 8px; object-fit: contain; background: white; border-radius: 8px; padding: 3px; }
        .channel-btn span { font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">ZHYAR TV</div>

    <div class="video-container">
        <video id="video" controls autoplay></video>
    </div>

    <div class="grid-container" id="channel-grid">
        </div>

    <script>
        const channels = [
            { name: "Rudaw HD", link: "https://shls-rudaw-prod.mediaminer.me/rudaw/livestream/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Rudaw_Logo.png/600px-Rudaw_Logo.png" },
            { name: "NRT News", link: "https://nrttv.com/live/index.m3u8", logo: "https://www.nrttv.com/Content/images/logo_nrt.png" },
            { name: "Kurdsat News", link: "https://v7.shls.news/hls/kurdsat/index.m3u8", logo: "https://kurdsat.tv/images/logo.png" },
            { name: "Channel 8", link: "https://channel8.com/live/index.m3u8", logo: "https://channel8.com/assets/img/logo-c8.png" },
            { name: "WAAR TV", link: "https://waartv.com/live/index.m3u8", logo: "https://waartv.com/wp-content/uploads/2021/05/logo.png" },
            { name: "Kurdistan 24", link: "https://live.kurdistan24.net/hls/k24.m3u8", logo: "https://www.kurdistan24.net/assets/images/logo.png" },
            { name: "Ava Entertainment", link: "https://ava.stream.me/hls/ava.m3u8", logo: "https://avatv.net/assets/images/logo.png" },
            { name: "NRT 2", link: "https://nrttv.com/live/nrt2.m3u8", logo: "https://www.nrttv.com/Content/images/nrt2_logo.png" },
            { name: "Kurdsat HD", link: "https://v7.shls.news/hls/kurdsat_hd/index.m3u8", logo: "https://kurdsat.tv/images/logo.png" },
            { name: "Pelistank TV", link: "https://v7.shls.news/hls/pelistank/index.m3u8", logo: "https://pelistank.tv/images/logo.png" },
            { name: "Kurdmax Music", link: "", logo: "https://kurdmax.tv/images/music-logo.png" },
            { name: "Kurdmax Show", link: "", logo: "https://kurdmax.tv/images/show-logo.png" },
            { name: "Speda TV", link: "", logo: "https://via.placeholder.com/150?text=Speda" },
            { name: "Payam TV", link: "", logo: "https://via.placeholder.com/150?text=Payam" },
            { name: "KNN", link: "", logo: "https://via.placeholder.com/150?text=KNN" },
            { name: "Net TV", link: "", logo: "https://via.placeholder.com/150?text=Net" },
            { name: "Duhok TV", link: "", logo: "https://via.placeholder.com/150?text=Duhok" },
            { name: "Kirkuk TV", link: "", logo: "https://via.placeholder.com/150?text=Kirkuk" },
            { name: "Avar TV", link: "", logo: "https://via.placeholder.com/150?text=Avar" },
            { name: "Hormzyar HD", link: "", logo: "https://via.placeholder.com/150?text=Hormzyar" }
            // دەتوانیت تا ٣٠ کەناڵ بەم شێوەیە لێرەدا زیادیان بکەیت
        ];

        const grid = document.getElementById('channel-grid');
        const video = document.getElementById('video');
        let hls = new Hls();

        channels.forEach(ch => {
            const btn = document.createElement('div');
            btn.className = 'channel-btn';
            btn.innerHTML = `<img src="${ch.logo}" alt="${ch.name}"><span>${ch.name}</span>`;
            btn.onclick = () => {
                if (ch.link === "") {
                    alert("ئەم کەناڵە هێشتا لینکی m3u8 بۆ دانەنراوە!");
                } else {
                    playM3U8(ch.link);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            grid.appendChild(btn);
        });

        function playM3U8(url) {
            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }
        
        playM3U8(channels[0].link);
    </script>
</body>
</html>
